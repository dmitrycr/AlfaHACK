paths:
  data_dir: ${DATA_DIR:-data}        # по умолчанию ml/data; CSV разделитель ';', bank_analytics/ внутри
  store: .cache/ml_store.sqlite      # кеш LLM, журнал, бюджет, кеш тегов и карточек
  bank_chunks: data/bank_chunks.jsonl
  profiles: data/profiles.json
  fixtures: tests/fixtures
  reports: reports
llm:
  mode: mock                 # mock | http (переопределяется LLM_MODE)
  base_url: ${LLM_BASE_URL:-https://changellenge.up.railway.app/v1}                # основной адрес организаторов
  base_url_reserve: ${LLM_BASE_URL_RESERVE:-https://api.alfahack-gateway26.ru/v1}  # резервный: один заход при сети/5xx основного
  timeout_s: 60
  net_retries: 2
  retry_pause_s: 1.0
  models:
    tagging: google/gemma-4-26b-a4b-it
    link_check: google/gemma-4-26b-a4b-it
    card: z-ai/glm-5.3-flash
    selfcheck: google/gemma-4-26b-a4b-it
    chat: qwen/qwen3.6-35b-a3b
    profile_hypothesis: qwen/qwen3.6-35b-a3b
    fallback: deepseek/deepseek-v4.1-flash
  card_model_final: moonshotai/kimi-k2.6   # модель карточек для финального прогона
  json_mode: true            # response_format {"type": "json_object"}; при 4xx шлюза отключается для модели без падения
  raw_failures_path: out/raw_failures.jsonl   # сырые невалидные ответы модели (диагностика), пусто = не писать
  final_run: false           # true = карточки идут на card_model_final вместо models.card
  cheap_model: google/gemma-4-26b-a4b-it   # режим деградации
  daily_limit_rub: 500
  degrade_at: 0.8
  cache_only_at: 0.95
  price_unit_tokens: 1000000  # цены в prices даны за 1 млн токенов (подтверждено организаторами)
  prices:                    # ₽ за price_unit_tokens токенов; токены рассуждений оплачиваются по цене выхода
    z-ai/glm-5.3-flash: {in: 5.10, out: 17.00}
    deepseek/deepseek-v4.1-flash: {in: 10.00, out: 21.00}
    google/gemma-4-26b-a4b-it: {in: 4.48, out: 23.00}
    qwen/qwen3-vl-30b-a3b-instruct: {in: 14.30, out: 57.10}
    qwen/qwen3.6-35b-a3b: {in: 5.33, out: 74.00}
    moonshotai/kimi-k2.6: {in: 51.00, out: 270.00}
  disable_reasoning: []      # модели, которым отключаем рассуждения
  disable_reasoning_param: {reasoning: {enabled: false}}   # TODO(align): формат параметра у шлюза не известен, заглушка
ranking:
  channels_enabled: [отраслевой, конкурент, спрос, предложение, финансовый, валютный, сырьевой, региональный, регуляторный]
  default_weights: {отраслевой: 1.0, конкурент: 0.7, финансовый: 0.2, валютный: 0.2, сырьевой: 0.0, региональный: 0.5, регуляторный: 0.6}
  threshold: 0.15
  threshold_step: 0.05
  threshold_min: 0.05
  min_events: 5
  freshness_steps: [[1, 1.0], [3, 0.8], [7, 0.5], [14, 0.3], [9999, 0.15]]
  payments_F_cap: 0.40
  concentration_threshold: 0.40
  concentration_boost: 1.2
  coverage_payments_only: 0.50
  coverage_matrix_only: 0.30
agent:
  top_n: 10
  degraded_top_n: 5
  max_retries_per_step: 2
  collapsed_max_words: 120
  card_cache: true
knowledge:
  chunk_chars: [500, 800]
  overlap: 100
  k: 3
  min_score: 0.5             # подобрано по tests/fixtures/rag_queries.csv
  min_coverage: 0.5          # доля лемм запроса во фрагменте; TODO(align): подобрать на реальных PDF банка
tagging:
  lead_chars: 700
  min_text_chars: 20
company_service:
  address: company-service:9090          # gRPC; переопределяется COMPANY_SERVICE_ADDR
  timeout_s: 10
  signed_context_header: ""               # TODO(align): имя metadata-заголовка для подписанного контекста неизвестно; пусто - не отправляем
  # значение подписанного контекста - только из окружения COMPANY_SIGNED_CONTEXT, в конфиге и логах не хранится
export:
  include_features: false    # TODO(align): false, пока в Company Service нет поля features (model.Profile, OpenAPI, ReadImport)
profile:
  revenue_threshold: 15000000000   # рубли, допущение
  concentration_threshold: 0.40
  concentration_min_counterparties: 5      # концентрация стороны считается при >= N контрагентов; строк в таблице платежей = число контрагентов, PAY_CNT здесь не используется
  concentration_min_coverage: 0.3    # ... и покрытии стороны >= порога
  channel_weights:
    отраслевой: 1.0
    конкурент: 0.7
    сырьевой: 0.7
    региональный: 0.5
    регуляторный: 0.6
    валютный: {fts: 0.9, none: 0.2}
    финансовый: {loan_or_leasing: 0.9, guarantee_or_factoring: 0.6, deposit_only: 0.4, none: 0.2}

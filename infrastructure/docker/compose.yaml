name: alfa-insight

x-app: &app
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  depends_on:
    postgres: {condition: service_healthy}
    kafka-init: {condition: service_completed_successfully}
  networks: [backend]
  environment: &env
    APP_ENV: ${APP_ENV:-development}
    INTERNAL_KEY: ${INTERNAL_KEY:?Run scripts/setup.sh}
    KAFKA_BROKERS: kafka:9092
    HTTP_ADDR: :8080
    GRPC_ADDR: :9090

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: alfa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.sh}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?required}
      COMPANY_DB_PASSWORD: ${COMPANY_DB_PASSWORD:?required}
      NEWS_DB_PASSWORD: ${NEWS_DB_PASSWORD:?required}
      EVENTS_DB_PASSWORD: ${EVENTS_DB_PASSWORD:?required}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?Run scripts/setup-llm.sh}
      INSIGHTS_DB_PASSWORD: ${INSIGHTS_DB_PASSWORD:?Run scripts/setup-llm.sh}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?required}
    ports: ["127.0.0.1:${POSTGRES_PORT:-15432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init.sh:/docker-entrypoint-initdb.d/001-init.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d alfa"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [backend]

  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_MESSAGE_MAX_BYTES: 3145728
      KAFKA_REPLICA_FETCH_MAX_BYTES: 3145728
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports: ["127.0.0.1:${KAFKA_PORT:-19092}:19092"]
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks: [backend]

  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        for topic in news.articles.v1 news.ingestion.v1 events.lifecycle.v1 processing.dlq.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done
    networks: [backend]

  company-service:
    <<: *app
    build: {context: ../.., dockerfile: services/company-service/Dockerfile}
    environment:
      <<: *env
      DATABASE_URL: postgres://app_company:${COMPANY_DB_PASSWORD}@postgres:5432/alfa?sslmode=disable
      SEED_DEMO: ${SEED_DEMO:-true}
      COMPANY_REGISTRY_MODE: ${COMPANY_REGISTRY_MODE:-mock}

  news-service:
    <<: *app
    build: {context: ../.., dockerfile: services/news-service/Dockerfile}
    environment:
      <<: *env
      DATABASE_URL: postgres://app_news:${NEWS_DB_PASSWORD}@postgres:5432/alfa?sslmode=disable
      SOURCE_MODE: fixture

  event-service:
    <<: *app
    build: {context: ../.., dockerfile: services/event-service/Dockerfile}
    environment:
      <<: *env
      DATABASE_URL: postgres://app_events:${EVENTS_DB_PASSWORD}@postgres:5432/alfa?sslmode=disable

  analytics-service:
    <<: *app
    build: {context: ../.., dockerfile: services/analytics-service/Dockerfile}
    environment:
      <<: *env
      DATABASE_URL: postgres://app_analytics:${ANALYTICS_DB_PASSWORD}@postgres:5432/alfa?sslmode=disable

  ai-agent-service:
    <<: *app
    build: {context: ../.., dockerfile: services/ai-agent-service/Dockerfile}
    environment:
      <<: *env
      DATABASE_URL: postgres://app_agent:${AGENT_DB_PASSWORD}@postgres:5432/alfa?sslmode=disable
      LLM_MODE: ${LLM_MODE:-mock}
      LLM_MOCK_SCENARIO: ${LLM_MOCK_SCENARIO:-success}
      LLM_DAILY_LIMIT_MINOR: ${LLM_DAILY_LIMIT_MINOR:-50000}
      LLM_MAX_PARALLEL: ${LLM_MAX_PARALLEL:-4}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-3}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://changellenge.up.railway.app/v1}
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-https://api.alfahack-gateway26.ru/v1}
      LLM_CONFIG_REVISION: ${LLM_CONFIG_REVISION:-1}
      LLM_PAID_CALLS_ENABLED: ${LLM_PAID_CALLS_ENABLED:-false}
      LLM_PRICE_UNIT_TOKENS: ${LLM_PRICE_UNIT_TOKENS:-0}
      LLM_TARIFFS_CONFIRMED: ${LLM_TARIFFS_CONFIRMED:-false}
      LLM_PRICES_JSON: ${LLM_PRICES_JSON:-}
      LLM_KEY_INFO_URL: ${LLM_KEY_INFO_URL:-}
      LLM_KEY_INFO_REMAINING_PATH: ${LLM_KEY_INFO_REMAINING_PATH:-}
      LLM_BUDGET_CONTRACT_CONFIRMED: ${LLM_BUDGET_CONTRACT_CONFIRMED:-false}
      LLM_USAGE_CONTRACT_CONFIRMED: ${LLM_USAGE_CONTRACT_CONFIRMED:-false}
      LLM_TOKEN_LIMIT_PARAMETER: ${LLM_TOKEN_LIMIT_PARAMETER:-}
      LLM_TOKEN_LIMIT_CONFIRMED: ${LLM_TOKEN_LIMIT_CONFIRMED:-false}
      LLM_ALLOW_KIMI: ${LLM_ALLOW_KIMI:-false}
      LLM_MODEL_TAG: ${LLM_MODEL_TAG:-z-ai/glm-5.3-flash}
      LLM_MODEL_PROFILE: ${LLM_MODEL_PROFILE:-deepseek/deepseek-v4.1-flash}
      LLM_MODEL_INSIGHT: ${LLM_MODEL_INSIGHT:-qwen/qwen3.6-35b-a3b}
      LLM_MODEL_CHECK: ${LLM_MODEL_CHECK:-google/gemma-4-26b-a4b-it}
      LLM_MODEL_CHAT: ${LLM_MODEL_CHAT:-z-ai/glm-5.3-flash}

  insight-service:
    <<: *app
    build: {context: ../.., dockerfile: services/insight-service/Dockerfile}
    environment:
      <<: *env
      DATABASE_URL: postgres://app_insights:${INSIGHTS_DB_PASSWORD}@postgres:5432/alfa?sslmode=disable
      MATCH_MODE: ${MATCH_MODE:-mock}

  api-gateway:
    <<: *app
    networks: [backend, gateway-access]
    build: {context: ../.., dockerfile: services/api-gateway/Dockerfile}
    environment:
      <<: *env
      DATABASE_URL: postgres://app_auth:${AUTH_DB_PASSWORD}@postgres:5432/alfa?sslmode=disable
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_DEMO: ${SEED_DEMO:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?required}
      EMAIL_DELIVERY_MODE: ${EMAIL_DELIVERY_MODE:-mock}
    ports: ["127.0.0.1:${GATEWAY_PORT:-8080}:8080"]

networks:
  backend:
    internal: true
  gateway-access: {}
volumes:
  postgres-data:
  kafka-data:
